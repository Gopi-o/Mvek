<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA-Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <header>
            <h1>To-Do List</h1>
        </header>

        <section id="add-task-section">
            <h2>Добавить задачу</h2>
            <form id="add-task-form">
                <label for="new-task-input">Новая задача:</label>
                <input type="text" id="new-task-input" name="task" placeholder="Введите текст задачи">
                <button type="submit">Добавить</button>
            </form>
        </section>

        <section id="add-many-tasks-section">
            <h2>Добавить очень много задач</h2>
            <button class="add-many-tasks-button" type="button">Добавить</button>
            <button class="filter-heavy-button" type="button">Фильтр Long Task (заморозит!)</button>
            <button class="filter-chunked-button" type="button">Фильтр по чанкам (плавно)</button>
            <button class="custom-button" type="button">Кастомная кнопка</button>
        </section>

        <section id="tasks-section">
            <h2>Список задач</h2>
            <ul id="task-list">

                <li class="task-item" data-task-id="1">

                    <div class="task-view">
                        <span class="task-text">Пример задачи</span>
                        <button class="edit-task-button" type="button">Редактировать</button>
                        <button class="delete-task-button" type="button">Удалить</button>
                    </div>

                    <form class="task-edit-form">
                        <input type="text" name="edited-task" value="Пример задачи">
                        <button type="submit">Сохранить</button>
                    </form>

                </li>


            </ul>
        </section>


    </div>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
