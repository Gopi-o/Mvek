{% extends 'bot_app/base.html' %}

{% block title %}Удаление проекта{% endblock %}

{% block content %}
<div class="container" style="max-width: 400px; padding-top: 4rem; text-align: center;">
    <div class="card" style="border-color: rgba(231, 76, 60, 0.5);">
        <h1 style="color: #e74c3c; margin-bottom: 1rem;">Удалить проект?</h1>
        <p style="color: #888; margin-bottom: 2rem;">
            Проект <strong>{{ object.name }}</strong> будет безвозвратно удален 
            вместе со всеми документами, конфигами и логами.
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div style="display: flex; gap: 1rem;">
                <a href="{% url 'project_detail' object.slug %}" class="btn btn-secondary" style="flex: 1;">Отмена</a>
                <button type="submit" class="btn btn-danger" style="flex: 1;">Удалить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
