{% extends 'bot_app/base.html' %}

{% block title %}Вход — Project Architect Bot{% endblock %}

{% block content %}
<div class="container" style="max-width: 400px; padding-top: 4rem;">
    <div class="card" style="text-align: center;">
        <p style="color: #888; margin-bottom: 2rem;">Войдите в свой аккаунт</p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group" style="text-align: left;">
                <label>Имя пользователя</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            
            <div class="form-group" style="text-align: left;">
                <label>Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            {% if form.errors %}
                <div class="alert alert-error" style="text-align: left;">
                    Неверное имя пользователя или пароль
                </div>
            {% endif %}
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Войти →
            </button>
        </form>
        
        <p style="margin-top: 1.5rem; color: #666; font-size: 0.9rem;">
            Нет аккаунта? <a href="{% url 'register' %}" style="color: #667eea;">Создать</a>
        </p>
    </div>
</div>
{% endblock %}
